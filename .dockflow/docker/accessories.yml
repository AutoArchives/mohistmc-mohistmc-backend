services:
  mohistmc-db:
    image: postgres:17
    command:
      - postgres
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    networks:
      - mohistmc-shared
      - default
    volumes:
      - mohistmc-postgres-data:/var/lib/postgresql/data
    # Do not publish a port: Swarm ignores the host IP, so any mapping exposes the database publicly.
    environment:
      POSTGRES_DB: "{{ current.env.db_name }}"
      POSTGRES_USER: "{{ current.env.db_username }}"
      POSTGRES_PASSWORD: "{{ current.env.db_password }}"

volumes:
  mohistmc-postgres-data:

networks:
  mohistmc-shared:
    external: true
  default:
